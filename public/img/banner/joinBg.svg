      <stop offset="0%" style="stop-color:#E10600;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#C10500;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#A10400;stop-opacity:0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
